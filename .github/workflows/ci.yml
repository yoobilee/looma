# 로컬과 같은 검증 진입점(npm run verify)을 PR과 main push마다 실행한다.
# 필수 검사이므로 paths 필터·조건부 skip·continue-on-error를 두지 않는다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # verify의 test:browser가 실제 Chromium IndexedDB로 저장소 회귀를 확인한다. 잠금 파일의 playwright 버전에 맞는 headless shell만 설치한다.
      - run: npx playwright install --with-deps --only-shell chromium

      - run: npm run verify
